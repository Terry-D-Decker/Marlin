name: Cloud Marlin Build (Native Bugfix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python Engine
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install PlatformIO Compiler
      run: pip install -U platformio

    - name: Compile Custom CR-10 Firmware
      run: platformio run -e STM32G0B1RE_btt

    - name: Upload Ready Firmware Binary
      uses: actions/upload-artifact@v4
      with:
        name: Custom_CR10_Firmware
        path: .pio/build/STM32G0B1RE_btt/firmware.bin
